<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Pushti Shangar</title>
    <meta
      name="description"
      content="E-commerce web application for Pushti Shangar divine attire and spiritual products."

    <meta property="og:title" content="Pushti Shangar" />

      property="og:description"
      content="E-commerce web application for Pushti Shangar divine attire and spiritual products."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const wrapperThumb = document.querySelectorAll("#wrapper-thumb .thumb");
        wrapperThumb.forEach((thumb) => {
          const previewImage = document.getElementById("preview_img");
          thumb.addEventListener("click", (e) => {
            e.preventDefault();
            const color = thumb.getAttribute("data-color");
            if (previewImage && color) {
              previewImage.style.backgroundColor = color;
            }
          });
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
  </body>
</html>
